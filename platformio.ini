[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ESP32Async/AsyncTCP@^3.3.2
    ; v3.12.0 misclassifies MCP POST requests whose standard Accept header
    ; includes text/event-stream as SSE, so /mcp falls through to 404.
    ; Pin the upstream GET-only SSE classification fix until the next release.
    https://github.com/ESP32Async/ESPAsyncWebServer.git#c265dcf01fc81a8d51e45ff2837c5d3d1f8f4d55
    h2zero/NimBLE-Arduino@^2.2.3
    lovyan03/LovyanGFX@^1.2.0
    WiFi
    ESPmDNS
    solnera/ESP-MCP@0.5.1
monitor_speed = 115200
upload_protocol = esptool
; ALIENTEK DNESP32S3: ESP32-S3-WROOM-1-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
extra_scripts = tools/pio_fonts.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    ; show_layout / show_slides requests carry whole screen descriptions.
    -D MCP_HTTP_MAX_BODY_SIZE=16384
    -D CONFIG_MDNS_MAX_SERVICES=10
    -D CONFIG_MDNS_TASK_PRIORITY=1
    -D CONFIG_MDNS_TTL=30
