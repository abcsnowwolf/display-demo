    <p style="flex:1;font-size:16px;font-family:kai;line-height:1.4">今天出门时，树影刚好落在门口。路边的桂花开了，风一吹，香气就跟着人走。<br>不必把每一分钟都填满。给一杯茶留点时间，也给尚未想清楚的事情留一点空白。走过熟悉的街道，看看路边新长出来的小草，听听远处的鸟鸣，原来平常的一天也有许多值得记住的片刻。</p>
